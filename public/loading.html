<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Starting Antigravity Attendance System</title>
  <style>
    :root {
      --color-bg: #09090b;
      --color-primary: #ff6b00;
      --color-text-main: #f4f4f5;
      --color-text-sub: #a1a1aa;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .container {
      text-align: center;
      max-width: 450px;
      padding: 20px;
    }

    .logo-container {
      margin-bottom: 30px;
      position: relative;
      display: inline-block;
    }

    .spinner {
      width: 64px;
      height: 64px;
      border: 4px solid rgba(255, 107, 0, 0.1);
      border-left-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }

    .title {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 8px 0;
      letter-spacing: -0.025em;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--color-text-sub);
      margin: 0;
      line-height: 1.5;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h2 class="title">Starting Attendance System</h2>
    <p class="subtitle">Initializing database, synchronizing spreadsheets, and establishing connections to camera streams. This may take up to a minute on system boot...</p>
  </div>
</body>
</html>
