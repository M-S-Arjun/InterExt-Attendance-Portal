<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff6b00">
  <title>Admin Login - InterExt Attendance Portal</title>
  <!-- Google Fonts - Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="/lucide.min.js"></script>
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      background-color: var(--bg-primary, #050508);
      background-image: radial-gradient(circle at 10% 20%, var(--radial-glow-1, rgba(255, 107, 0, 0.07)) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, var(--radial-glow-2, rgba(255, 255, 255, 0.01)) 0%, transparent 45%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 400px;
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .login-card {
      background: var(--glass-bg, rgba(15, 15, 21, 0.6));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.05));
      border-radius: 16px;
      padding: 40px 30px;
      box-shadow: var(--shadow-lg, 0 10px 30px -10px rgba(0, 0, 0, 0.7));
    }
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-logo {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      margin-bottom: 15px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 0 15px var(--btn-primary-shadow);
    }
    .login-header h2 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-primary, #fff);
      margin-bottom: 5px;
    }
    .login-header p {
      font-size: 0.85rem;
      color: var(--text-tertiary, #a1a1aa);
    }
    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-group label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary, #d4d4d8);
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrapper i {
      position: absolute;
      left: 12px;
      color: var(--text-tertiary);
      width: 18px;
      height: 18px;
    }
    .input-control {
      width: 100%;
      padding: 12px 12px 12px 40px;
      border-radius: 8px;
      border: 1px solid var(--glass-border, rgba(255,255,255,0.05));
      background: rgba(0, 0, 0, 0.2);
      color: var(--text-primary, #fff);
      font-size: 0.9rem;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .input-control:focus {
      outline: none;
      border-color: var(--color-primary, #ff6b00);
      box-shadow: 0 0 0 3px var(--focus-shadow, rgba(255, 107, 0, 0.15));
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: var(--color-primary, #ff6b00);
      color: #fff;
      border: 1px solid var(--color-primary);
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px var(--btn-primary-shadow);
      margin-top: 10px;
      font-family: inherit;
    }
    .btn-login:hover {
      background: var(--color-primary-hover, #e05e00);
      transform: translateY(-1px);
    }
    .btn-login:active {
      transform: translateY(0);
    }
    .error-msg {
      background: var(--color-error-bg, rgba(244, 63, 94, 0.08));
      border: 1px solid rgba(244, 63, 94, 0.15);
      color: var(--color-error, #f43f5e);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin {
      animation: spin 1s linear infinite;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img src="/logo.jpg" class="login-logo" alt="InterExt Logo">
        <h2>INTEREXT</h2>
        <p>Admin Attendance & Payroll Portal</p>
      </div>

      <div id="error-box" class="error-msg">
        <i data-lucide="alert-triangle" style="width: 16px; height: 16px; flex-shrink: 0;"></i>
        <span id="error-text">Incorrect password. Please try again.</span>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="password">Admin Security Password</label>
          <div class="input-wrapper">
            <i data-lucide="lock"></i>
            <input type="password" id="password" class="input-control" placeholder="Enter admin password" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" class="btn-login" id="submit-btn">
          <span>Sign In</span>
          <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
        </button>
      </form>
    </div>
  </div>

  <script>
    lucide.createIcons();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submit-btn');
      const errorBox = document.getElementById('error-box');
      const errorText = document.getElementById('error-text');

      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Verifying...</span> <i class="animate-spin" data-lucide="loader" style="width:18px; height:18px;"></i>';
      lucide.createIcons();

      try {
        const resp = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        if (resp.ok) {
          // Redirect to root dashboard
          window.location.href = '/';
        } else {
          const errData = await resp.json().catch(() => ({}));
          errorText.textContent = errData.error || 'Authentication failed.';
          errorBox.style.display = 'flex';
        }
      } catch (err) {
        errorText.textContent = 'Server connection failed.';
        errorBox.style.display = 'flex';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Sign In</span> <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>';
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
